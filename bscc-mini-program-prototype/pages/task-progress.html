<!DOCTYPE html>
<html class="light" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>标书查重 - 任务进度</title>
    <style id="theme-vars">
:root {
  --bscc-bg-page: #F5F7F8;
  --bscc-bg-card: #FFFFFF;
  --bscc-bg-muted: #EEF3F4;
  --bscc-bg-soft: #F8FBFB;
  --bscc-text: #1F2933;
  --bscc-text-secondary: #68727D;
  --bscc-text-tertiary: #8B98A4;
  --bscc-primary: #126E6A;
  --bscc-primary-deep: #0B4F4C;
  --bscc-primary-soft: rgba(18, 110, 106, 0.10);
  --bscc-border: #DDE3E7;
  --bscc-risk-high: #D64545;
  --bscc-risk-high-soft: rgba(214, 69, 69, 0.12);
  --bscc-risk-medium: #D97706;
  --bscc-risk-medium-soft: rgba(217, 119, 6, 0.12);
  --bscc-semantic: #2563EB;
  --bscc-semantic-soft: rgba(37, 99, 235, 0.12);
  --bscc-keyword: #7C3AED;
  --bscc-keyword-soft: rgba(124, 58, 237, 0.12);
  --bscc-success: #0F8F5D;
  --bscc-success-soft: rgba(15, 143, 93, 0.12);
  --bscc-system-border: rgba(15, 23, 42, 0.10);
  --bscc-system-bg: rgba(255, 255, 255, 0.92);
  --bscc-system-text: #111827;
  --bscc-shadow-sm: 0 6px 16px rgba(31, 41, 51, 0.05);
  --bscc-shadow-md: 0 10px 20px rgba(31, 41, 51, 0.05);
  --bscc-radius-xs: 10px;
  --bscc-radius-sm: 14px;
  --bscc-radius-md: 12px;
  --bscc-radius-lg: 16px;
  --bscc-safe-top: env(safe-area-inset-top, 0px);
  --bscc-safe-bottom: env(safe-area-inset-bottom, 0px);
}

html,
body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  background: var(--bscc-bg-page);
  color: var(--bscc-text);
  font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
}

body {
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

a {
  color: inherit;
  text-decoration: none;
}

button,
input,
textarea {
  font: inherit;
}

.bscc-app-shell {
  width: 100%;
  max-width: 430px;
  min-height: 100vh;
  margin: 0 auto;
  background: var(--bscc-bg-page);
}

.bscc-surface {
  background: var(--bscc-bg-card);
  border: 1px solid var(--bscc-border);
  border-radius: var(--bscc-radius-md);
  box-shadow: var(--bscc-shadow-sm);
}

.bscc-title-xl {
  font-size: 24px;
  line-height: 1.2;
  font-weight: 700;
  letter-spacing: -0.03em;
}

.bscc-title-lg {
  font-size: 20px;
  line-height: 1.28;
  font-weight: 700;
  letter-spacing: -0.02em;
}

.bscc-title-md {
  font-size: 17px;
  line-height: 1.35;
  font-weight: 600;
}

.bscc-body {
  font-size: 14px;
  line-height: 1.6;
}

.bscc-caption {
  font-size: 12px;
  line-height: 1.45;
  color: var(--bscc-text-secondary);
}

.bscc-mono {
  font-family: "JetBrains Mono", "Cascadia Code", "Consolas", monospace;
  font-size: 12px;
  line-height: 1.45;
}

.bscc-wechat-top {
  padding-top: calc(10px + var(--bscc-safe-top));
}

.bscc-divider {
  border-color: var(--bscc-border);
}

.bscc-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border-radius: 999px;
  padding: 6px 10px;
  font-size: 12px;
  line-height: 1;
  white-space: nowrap;
}

.bscc-tabbar-safe {
  padding-bottom: calc(10px + var(--bscc-safe-bottom));
}

.bscc-page-safe-bottom {
  padding-bottom: calc(132px + var(--bscc-safe-bottom));
}

.bscc-page-safe-bottom-lg {
  padding-bottom: calc(208px + var(--bscc-safe-bottom));
}

.bscc-soft-scroll::-webkit-scrollbar {
  display: none;
}

.bscc-soft-scroll {
  -ms-overflow-style: none;
  scrollbar-width: none;
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--bscc-primary);
    --color-border: var(--bscc-border);
  }
  @layer base {
    body { background: var(--bscc-background); color: var(--bscc-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="bg-[var(--bscc-bg-page)] text-[var(--bscc-text)]">
  <div class="bscc-app-shell min-h-screen">
    <div class="bscc-wechat-top sticky top-0 z-30 bg-[var(--bscc-bg-page)]/95 backdrop-blur-sm">
      <div class="px-4">
        <div class="flex items-center justify-between px-1 text-[12px] font-medium text-[var(--bscc-text)]">
          <span>09:43</span>
          <div class="flex items-center gap-1.5 text-[var(--bscc-text-secondary)]">
            <i data-lucide="signal-high" class="h-3.5 w-3.5"></i>
            <i data-lucide="wifi" class="h-3.5 w-3.5"></i>
            <i data-lucide="battery-full" class="h-3.5 w-3.5"></i>
          </div>
        </div>
        <div class="mt-3 flex items-center justify-between pb-3">
          <button data-dom-id="back-home" class="flex h-10 w-[88px] items-center gap-1 text-[14px] font-medium text-[var(--bscc-text)]">
            <i data-lucide="chevron-left" class="h-4.5 w-4.5"></i>
            返回
          </button>
          <div class="text-center">
            <h1 class="text-[17px] font-semibold leading-none text-[var(--bscc-text)]">任务进度</h1>
          </div>
          <div class="flex h-8 w-[88px] items-center justify-center rounded-full border border-[var(--bscc-system-border)] bg-[var(--bscc-system-bg)] text-[var(--bscc-system-text)]" aria-label="小程序菜单">
            <button class="flex h-full flex-1 items-center justify-center" aria-label="更多">
              <i data-lucide="more-horizontal" class="h-4 w-4"></i>
            </button>
            <span class="h-4 w-px bg-[var(--bscc-system-border)]" aria-hidden="true"></span>
            <button class="flex h-full flex-1 items-center justify-center" aria-label="关闭">
              <i data-lucide="x" class="h-4 w-4"></i>
            </button>
          </div>
        </div>
      </div>
    </div>

    <main class="px-4 pb-8 pt-3">
      

      <section class="mt-3 rounded-[var(--bscc-radius-md)] border border-[var(--bscc-border)] bg-[var(--bscc-bg-card)] p-4 shadow-[var(--bscc-shadow-sm)]">
        <div class="flex items-center justify-between gap-3">
          <div>
            <h2 class="text-[16px] font-semibold text-[var(--bscc-text)]">步骤进度</h2>
            <p class="mt-1 text-[12px] leading-5 text-[var(--bscc-text-secondary)]">排队中 / 解析中 / 查重中 / 待解锁或完成</p>
          </div>
          <span class="rounded-full bg-[var(--bscc-primary-soft)] px-2.5 py-1 text-[12px] font-semibold text-[var(--bscc-primary)]">68%</span>
        </div>
        <div class="mt-4 h-2.5 overflow-hidden rounded-full bg-[var(--bscc-bg-muted)]">
          <div class="h-full rounded-full bg-[var(--bscc-primary)]" style="width: 68%;"></div>
        </div>
        <div class="mt-4 grid grid-cols-4 gap-2">
          <div class="rounded-[var(--bscc-radius-sm)] bg-[var(--bscc-bg-soft)] px-2.5 py-3 text-center">
            <div class="mx-auto flex h-7 w-7 items-center justify-center rounded-full bg-[var(--bscc-success-soft)] text-[var(--bscc-success)]">
              <i data-lucide="check" class="h-4 w-4"></i>
            </div>
            <p class="mt-2 text-[11px] font-medium text-[var(--bscc-text)]">排队中</p>
          </div>
          <div class="rounded-[var(--bscc-radius-sm)] bg-[var(--bscc-bg-soft)] px-2.5 py-3 text-center">
            <div class="mx-auto flex h-7 w-7 items-center justify-center rounded-full bg-[var(--bscc-success-soft)] text-[var(--bscc-success)]">
              <i data-lucide="check" class="h-4 w-4"></i>
            </div>
            <p class="mt-2 text-[11px] font-medium text-[var(--bscc-text)]">解析中</p>
          </div>
          <div class="rounded-[var(--bscc-radius-sm)] border border-[var(--bscc-primary)] bg-[var(--bscc-primary-soft)] px-2.5 py-3 text-center">
            <div class="mx-auto flex h-7 w-7 items-center justify-center rounded-full bg-[var(--bscc-primary)] text-white">
              <i data-lucide="loader-circle" class="h-4 w-4"></i>
            </div>
            <p class="mt-2 text-[11px] font-semibold text-[var(--bscc-primary)]">查重中</p>
          </div>
          <div class="rounded-[var(--bscc-radius-sm)] bg-[var(--bscc-bg-soft)] px-2.5 py-3 text-center">
            <div class="mx-auto flex h-7 w-7 items-center justify-center rounded-full bg-[var(--bscc-bg-card)] text-[var(--bscc-text-secondary)]">
              <i data-lucide="lock" class="h-4 w-4"></i>
            </div>
            <p class="mt-2 text-[11px] font-medium text-[var(--bscc-text-secondary)]">待解锁</p>
          </div>
        </div>
      </section>

      

      

      
    </main>
  </div>

  <style>
    [data-dom-id="cta-results"],
    [data-dom-id="back-home"] {
      transition: transform 160ms ease, opacity 160ms ease;
    }

    [data-dom-id="cta-results"]:hover,
    [data-dom-id="back-home"]:hover {
      transform: translateY(-1px);
    }
  </style>
  <script>lucide.createIcons();</script>
</body>
</html>
