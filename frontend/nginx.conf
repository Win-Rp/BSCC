server {
  listen 80;
  server_name _;

  client_max_body_size 200m;

  root /usr/share/nginx/html;
  index index.html;

  # pdf.js 的 ES Module Worker (.mjs) 必须返回 JS MIME 类型，
  # 否则浏览器会拒绝加载 worker，导致 PDF 无法预览
  location ~ \.mjs$ {
    default_type application/javascript;
    try_files $uri =404;
  }

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # 动态页面返回搜索引擎可见的 noindex；这不是访问权限控制。
  location ~ ^/(results|compare|admin(/login)?)/?$ {
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files /index.html =404;
  }

  # 将已知公开页面的末尾斜杠统一到站点地图中的规范地址。
  location ~ ^/(upload|free|check|compliance|docs|solutions/(engineering|business-team)|guides/(biaoshu-chachong|biaoshu-check|similarity-risk))/$ {
    absolute_redirect off;
    return 301 /$1$is_args$args;
  }

  location / {
    # SSG 预渲染产物为 *.html（如 /check -> check.html），
    # 未知地址返回 404；只有上面明确列出的动态页面回退到 SPA。
    try_files $uri $uri.html $uri/ =404;
  }
}
