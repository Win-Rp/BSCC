services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bscc-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.example
    environment:
      TZ: Asia/Shanghai
      ADMIN_TOKEN_SECRET: ${ADMIN_TOKEN_SECRET:-bscc-admin-prod-secret}
      ADMIN_TOKEN_EXPIRES_DAYS: ${ADMIN_TOKEN_EXPIRES_DAYS:-7}
    volumes:
      - ./backend/data:/app/data
      - ./backend/storage:/app/storage
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
    container_name: bscc-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
