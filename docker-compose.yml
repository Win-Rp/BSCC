services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bscc-backend
    networks:
      - panel
    restart: unless-stopped
    env_file:
      - ./backend/.env.example
    environment:
      # 现有 MySQL 的连接串，例如 mysql://user:password@host.docker.internal:3306/bscc
      DATABASE_URL: ${DATABASE_URL:?请在 .env 中配置现有 MySQL 的 DATABASE_URL}
      TZ: Asia/Shanghai
      ADMIN_TOKEN_SECRET: ${ADMIN_TOKEN_SECRET:-bscc-admin-prod-secret}
      ADMIN_TOKEN_EXPIRES_DAYS: ${ADMIN_TOKEN_EXPIRES_DAYS:-7}
    volumes:
      - ./backend/data:/app/data
      - ./backend/storage:/app/storage
    ports:
      - "9006:8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
        # These values are consumed at build time by Vite and embedded in the
        # generated frontend bundle. Define them in BSCC/.env or the shell.
        VITE_POSTHOG_KEY: ${VITE_POSTHOG_KEY:-}
        VITE_POSTHOG_HOST: ${VITE_POSTHOG_HOST:-https://us.i.posthog.com}
    container_name: bscc-frontend
    networks:
      - panel
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "9007:80"

networks:
  panel:
    name: 1panel-network
    external: true
