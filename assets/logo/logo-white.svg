<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 180" width="100%" role="img" aria-label="标书查重 BSCC Logo（反白版）">
  <defs>
    <linearGradient id="bscc-white-doc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dcecea"/>
    </linearGradient>
    <linearGradient id="bscc-soft-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.55)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.28)"/>
    </linearGradient>
    <filter id="bscc-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#042c2a" flood-opacity="0.28"/>
    </filter>
  </defs>

  <g transform="translate(0,8)">
    <g transform="rotate(-6 100 98)">
      <rect x="56" y="46" width="88" height="104" rx="14" fill="url(#bscc-soft-light)"/>
    </g>
    <g filter="url(#bscc-shadow)">
      <rect x="70" y="34" width="88" height="104" rx="14" fill="url(#bscc-white-doc)"/>
    </g>
    <path d="M128 34 L158 34 L158 64 Z" fill="#c3ddd9"/>
    <line x1="128" y1="34" x2="158" y2="64" stroke="#0b4f4c" stroke-opacity="0.25" stroke-width="2"/>
    <path d="M86 92 L103 109 L136 72" fill="none" stroke="#126e6a" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="200" y="104" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="60" font-weight="800" fill="#ffffff" letter-spacing="4">标书查重</text>
  <text x="202" y="138" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="rgba(255,255,255,0.72)" letter-spacing="5">BID DOCUMENT CHECK</text>
  <rect x="202" y="152" width="44" height="6" rx="3" fill="#ffb27a"/>
</svg>
