<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" role="img" aria-label="标书查重图标">
  <defs>
    <linearGradient id="bscc-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b8a83"/>
      <stop offset="100%" stop-color="#0b4f4c"/>
    </linearGradient>
    <linearGradient id="bscc-teal-soft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cde7e3"/>
      <stop offset="100%" stop-color="#a9d5cf"/>
    </linearGradient>
    <filter id="bscc-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0b4f4c" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- 背景文档 -->
  <g transform="rotate(-6 51 63)">
    <rect x="6" y="12" width="90" height="102" rx="16" fill="url(#bscc-teal-soft)"/>
  </g>

  <!-- 主文档 -->
  <g filter="url(#bscc-shadow)">
    <rect x="20" y="0" width="90" height="102" rx="16" fill="url(#bscc-teal)"/>
  </g>

  <!-- 折角 -->
  <path d="M78 0 L110 0 L110 32 Z" fill="#3ea89e"/>
  <line x1="78" y1="0" x2="110" y2="32" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2.4"/>

  <!-- 校验对勾 -->
  <path d="M34 58 L51 75 L88 36" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
